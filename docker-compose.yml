name: aircraft-maintenance

services:
  db:
    image: postgres:15-alpine
    container_name: aircraft-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aircraft_maintenance
    ports:
      - '5432:5432'
    networks:
      - aircraft-net
    volumes:
      - aircraft-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d aircraft_maintenance']
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway
    container_name: aircraft-flyway
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/aircraft_maintenance
      FLYWAY_USER: user
      FLYWAY_PASSWORD: password
    volumes:
      - ./sql/migrations:/flyway/sql
    networks:
      - aircraft-net
    command: migrate

networks:
  aircraft-net:
    external: true

volumes:
  aircraft-db-data:

